name: Maintenance scan

on:
  schedule:
    - cron: "45 15 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/qa/verify-maintenance-boundaries.mjs --mode ANALYZE
      - run: node scripts/qa/collect-maintenance-signals.mjs
      - run: node scripts/qa/build-maintenance-report.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: maintenance-analysis-report
          path: .artifacts/maintenance/
