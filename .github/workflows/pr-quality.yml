name: PR quality

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quick-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: node scripts/qa/run-quality-gates.mjs quick
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-quality-report
          path: .artifacts/maintenance/
